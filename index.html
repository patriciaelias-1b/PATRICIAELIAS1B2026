<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sketchbook.log</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topo">


<div class="barra">


<button class="menu-btn" onclick="abrirMenu()">
☰
</button>


<a class="home" href="index.html">
🏠
</a>


<h1>
Sketchbook.log
</h1>


<input 
type="text"
placeholder="pesquisar..."
id="pesquisa"
>


</div>



<div id="menu" class="menu">

<button onclick="abrirPerfil()">
Meu perfil
</button>


<button onclick="modoNoturno()">
Modo noturno
</button>


<button onclick="sair()">
Sair
</button>


</div>


</header>






<div class="layout">



<!-- ESQUERDA -->


<aside class="esquerda">


<h2>Tópicos</h2>


<button>
Desenhos
</button>


<button>
Estudos
</button>


<button>
Personagens
</button>


<button>
Materiais
</button>



</aside>







<!-- CENTRO -->


<main>


<section class="post">


<h2>
Meu sketchbook online
</h2>


<p>
Esse é meu espaço para colocar desenhos,
ideias e pensamentos.
</p>


<img src="images/desenho1.jpg">


</section>





<section class="chat">

<h2>Comentários</h2>


<div id="listaComentarios">


</div>



<div class="novo-comentario">


<input 
id="nomeComentario"
placeholder="seu nome"
>


<textarea 
id="textoComentario"
placeholder="escreva um comentário..."
></textarea>


<button onclick="adicionarComentario()">
comentar
</button>


</div>


</section>








<!-- DIREITA -->


<aside class="direita">


<div class="id-card">


<img src="images/eu.jpg">


<h2 id="nomePerfil">
Visitante
</h2>


<p>
Contas:
<span id="contas">
0
</span>
</p>



<p>
Status:
Criando ✦
</p>



</div>



</aside>



</div>






<!-- CRIAR CONTA -->


<div id="perfil" class="janela">


<h2>
Criar conta simbólica
</h2>


<p>
Não precisa colocar dados pessoais.
</p>


<input id="nomeInput" placeholder="Seu nome">


<button onclick="criarConta()">
Criar
</button>



</div>






<footer>

Sketchbook.log ©

</footer>



<script src="script.js"></script>


</body>

</html>
